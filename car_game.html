<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>🚗 코인 드라이브!</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #1a1a2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Segoe UI', sans-serif;
      overflow: hidden;
    }

    h1 {
      color: #f0c040;
      font-size: 2rem;
      margin-bottom: 12px;
      text-shadow: 0 0 20px #f0c04088;
      letter-spacing: 2px;
    }

    /* ── HUD ── */
    #hud {
      display: flex;
      gap: 32px;
      margin-bottom: 10px;
      font-size: 1.1rem;
      color: #fff;
    }
    .hud-box {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 12px;
      padding: 8px 22px;
      text-align: center;
    }
    .hud-box .label { font-size: 0.72rem; color: #aaa; letter-spacing: 1px; text-transform: uppercase; }
    .hud-box .value { font-size: 1.5rem; font-weight: 700; margin-top: 2px; }
    #timer-val { color: #f0c040; }
    #timer-val.danger { color: #ff4444; animation: blink 0.5s infinite; }
    #score-val { color: #4ecca3; }
    #best-val  { color: #f0a0ff; }

    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }

    /* ── CANVAS ── */
    #gameCanvas {
      border-radius: 16px;
      box-shadow: 0 0 40px rgba(0,0,0,0.7);
      display: block;
    }

    /* ── OVERLAY ── */
    #overlay {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      border-radius: 16px;
      background: rgba(0,0,0,0.82);
      color: #fff;
      text-align: center;
      padding: 40px 60px;
    }
    #overlay h2 { font-size: 2.2rem; }
    #overlay p  { font-size: 1rem; color: #ccc; line-height: 1.7; }
    #overlay .result-score { font-size: 3rem; font-weight: 800; color: #f0c040; }
    #overlay .result-label { font-size: 0.9rem; color: #aaa; }

    button {
      background: linear-gradient(135deg, #f0c040, #e08800);
      border: none;
      border-radius: 50px;
      color: #1a1a2e;
      font-size: 1.1rem;
      font-weight: 700;
      padding: 14px 40px;
      cursor: pointer;
      transition: transform .1s, box-shadow .1s;
      box-shadow: 0 4px 20px rgba(240,192,64,.5);
    }
    button:hover  { transform: translateY(-2px); box-shadow: 0 6px 24px rgba(240,192,64,.7); }
    button:active { transform: translateY(0); }

    #controls-hint {
      margin-top: 8px;
      color: #888;
      font-size: 0.82rem;
      letter-spacing: .5px;
    }
  </style>
</head>
<body>

<h1>🚗 코인 드라이브!</h1>

<div id="hud">
  <div class="hud-box">
    <div class="label">⏱ 남은 시간</div>
    <div class="value" id="timer-val">30</div>
  </div>
  <div class="hud-box">
    <div class="label">🪙 점수</div>
    <div class="value" id="score-val">0</div>
  </div>
  <div class="hud-box">
    <div class="label">🏆 최고 점수</div>
    <div class="value" id="best-val">0</div>
  </div>
</div>

<div style="position:relative;">
  <canvas id="gameCanvas" width="540" height="520"></canvas>
  <div id="overlay">
    <h2>🚗 코인 드라이브!</h2>
    <p>
      ← → 방향키 또는 <b>A / D</b> 키로 차선 변경<br>
      🪙 코인 획득 → <b>+10점 +5초</b><br>
      💣 폭탄 충돌 → <b>즉시 게임 종료!</b><br>
      30초 안에 최대한 많은 코인을 모으세요!
    </p>
    <button id="startBtn">🚀 게임 시작!</button>
  </div>
</div>

<div id="controls-hint">← → 방향키 또는 A / D 키로 이동</div>

<script>
/* ════════════════════════════════
   CONFIG
════════════════════════════════ */
const CANVAS_W = 540;
const CANVAS_H = 520;
const LANE_COUNT = 4;
const ROAD_LEFT  = 60;
const ROAD_RIGHT = 480;
const ROAD_W     = ROAD_RIGHT - ROAD_LEFT;          // 420
const LANE_W     = ROAD_W / LANE_COUNT;              // 105
const CAR_W = 44, CAR_H = 76;
const ITEM_R = 18;
const INITIAL_TIME = 30;
const COIN_TIME_BONUS = 5;
const COIN_SCORE     = 10;
const MAX_TIME = 60;   // 시간 상한

/* ════════════════════════════════
   STATE
════════════════════════════════ */
const canvas  = document.getElementById('gameCanvas');
const ctx     = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
const startBtn= document.getElementById('startBtn');
const timerEl = document.getElementById('timer-val');
const scoreEl = document.getElementById('score-val');
const bestEl  = document.getElementById('best-val');

let state = 'idle';  // idle | playing | dead | timeout
let score = 0, bestScore = 0;
let timeLeft = INITIAL_TIME;
let lastTick = 0;
let lane = 1;        // 0-3
let carY;
let items = [];
let roadOffset = 0;
let speed = 4;
let spawnTimer = 0;
let spawnInterval = 90; // frames
let frame = 0;
let shakeFrames = 0;
let keys = {};

/* lane centre x */
function laneX(l) { return ROAD_LEFT + l * LANE_W + LANE_W / 2; }

/* ════════════════════════════════
   INIT / RESET
════════════════════════════════ */
function initGame() {
  score     = 0;
  timeLeft  = INITIAL_TIME;
  lane      = 1;
  carY      = CANVAS_H - 120;
  items     = [];
  roadOffset= 0;
  speed     = 4;
  spawnTimer= 0;
  frame     = 0;
  shakeFrames = 0;
  lastTick  = performance.now();
  updateHUD();
}

/* ════════════════════════════════
   HUD
════════════════════════════════ */
function updateHUD() {
  timerEl.textContent = Math.ceil(timeLeft);
  scoreEl.textContent = score;
  bestEl.textContent  = bestScore;
  timerEl.classList.toggle('danger', timeLeft <= 10);
}

/* ════════════════════════════════
   SPAWN
════════════════════════════════ */
function spawnItem() {
  // 항상 코인 하나 + 랜덤하게 폭탄
  const usedLanes = new Set();

  // 코인 1~2개
  const coinCount = Math.random() < 0.5 ? 1 : 2;
  for (let i = 0; i < coinCount; i++) {
    let l;
    do { l = Math.floor(Math.random() * LANE_COUNT); } while (usedLanes.has(l));
    usedLanes.add(l);
    items.push({ type: 'coin', lane: l, x: laneX(l), y: -ITEM_R });
  }

  // 폭탄 (40% 확률로 1~2개, 단 빈 차선에만)
  if (Math.random() < 0.40) {
    const bombCount = Math.random() < 0.35 ? 2 : 1;
    for (let i = 0; i < bombCount; i++) {
      let l;
      let tries = 0;
      do { l = Math.floor(Math.random() * LANE_COUNT); tries++; } while (usedLanes.has(l) && tries < 10);
      if (!usedLanes.has(l)) {
        usedLanes.add(l);
        items.push({ type: 'bomb', lane: l, x: laneX(l), y: -ITEM_R });
      }
    }
  }
}

/* ════════════════════════════════
   DRAW HELPERS
════════════════════════════════ */
function drawRoad() {
  // 배경 (풀밭)
  ctx.fillStyle = '#2d5a27';
  ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

  // 도로 아스팔트
  ctx.fillStyle = '#3a3a3a';
  ctx.fillRect(ROAD_LEFT, 0, ROAD_W, CANVAS_H);

  // 도로 가장자리 흰 선
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(ROAD_LEFT, 0); ctx.lineTo(ROAD_LEFT, CANVAS_H); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(ROAD_RIGHT, 0); ctx.lineTo(ROAD_RIGHT, CANVAS_H); ctx.stroke();

  // 차선 점선
  ctx.setLineDash([30, 24]);
  ctx.lineWidth = 3;
  ctx.strokeStyle = '#ffff00aa';
  for (let i = 1; i < LANE_COUNT; i++) {
    const x = ROAD_LEFT + i * LANE_W;
    ctx.beginPath();
    ctx.moveTo(x, -roadOffset % 54);
    ctx.lineTo(x, CANVAS_H);
    ctx.stroke();
  }
  ctx.setLineDash([]);

  // 나무 장식 (좌우)
  drawTrees();
}

function drawTrees() {
  const treePositions = [60, 160, 260, 370, 470];
  const offset = roadOffset % 100;
  for (const base of treePositions) {
    const y = (base - offset + 600) % 600 - 50;
    // 왼쪽 나무
    drawTree(30, y);
    // 오른쪽 나무
    drawTree(510, y);
  }
}

function drawTree(x, y) {
  ctx.fillStyle = '#4a3728';
  ctx.fillRect(x - 5, y + 20, 10, 22);
  ctx.fillStyle = '#2d8a2d';
  ctx.beginPath();
  ctx.arc(x, y + 10, 18, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#3aaa3a';
  ctx.beginPath();
  ctx.arc(x - 5, y, 13, 0, Math.PI * 2);
  ctx.fill();
}

function drawCar(x, y, isPlayer = false) {
  const w = CAR_W, h = CAR_H;
  const cx = x - w / 2, cy = y - h / 2;

  if (isPlayer) {
    // 차체 (파란색 그라디언트)
    const grad = ctx.createLinearGradient(cx, cy, cx + w, cy + h);
    grad.addColorStop(0, '#5588ff');
    grad.addColorStop(1, '#2244cc');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.roundRect(cx, cy + 10, w, h - 14, 8);
    ctx.fill();

    // 루프
    ctx.fillStyle = '#3366ee';
    ctx.beginPath();
    ctx.roundRect(cx + 6, cy + 4, w - 12, 26, 6);
    ctx.fill();

    // 앞유리
    ctx.fillStyle = '#aaddffcc';
    ctx.beginPath();
    ctx.roundRect(cx + 7, cy + 6, w - 14, 14, 4);
    ctx.fill();

    // 뒷유리
    ctx.fillStyle = '#aaddff88';
    ctx.beginPath();
    ctx.roundRect(cx + 7, cy + 22, w - 14, 8, 4);
    ctx.fill();

    // 헤드라이트
    ctx.fillStyle = '#ffffaa';
    ctx.beginPath(); ctx.roundRect(cx + 4, cy + 11, 9, 5, 2); ctx.fill();
    ctx.beginPath(); ctx.roundRect(cx + w - 13, cy + 11, 9, 5, 2); ctx.fill();

    // 후미등
    ctx.fillStyle = '#ff3333';
    ctx.beginPath(); ctx.roundRect(cx + 4, cy + h - 8, 9, 5, 2); ctx.fill();
    ctx.beginPath(); ctx.roundRect(cx + w - 13, cy + h - 8, 9, 5, 2); ctx.fill();

    // 바퀴
    ctx.fillStyle = '#111';
    ctx.beginPath(); ctx.ellipse(cx + 4,     cy + 18, 5, 8, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx + w - 4, cy + 18, 5, 8, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx + 4,     cy + h - 14, 5, 8, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx + w - 4, cy + h - 14, 5, 8, 0, 0, Math.PI*2); ctx.fill();

    // 휠캡
    ctx.fillStyle = '#8899cc';
    ctx.beginPath(); ctx.arc(cx + 4,     cy + 18, 3, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + w - 4, cy + 18, 3, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + 4,     cy + h - 14, 3, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + w - 4, cy + h - 14, 3, 0, Math.PI*2); ctx.fill();

    // 배기 연기
    if (frame % 6 < 3) {
      ctx.fillStyle = 'rgba(200,200,200,0.3)';
      ctx.beginPath(); ctx.arc(cx + w / 2, cy + h + 4, 5, 0, Math.PI*2); ctx.fill();
    }
  }
}

function drawCoin(item, t) {
  const x = item.x, y = item.y;
  const pulse = 1 + 0.08 * Math.sin(t * 0.1 + x);
  const r = ITEM_R * pulse;

  // 그림자
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath(); ctx.ellipse(x, y + r + 2, r * 0.6, 4, 0, 0, Math.PI*2); ctx.fill();

  // 코인 외곽
  ctx.fillStyle = '#f0c040';
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill();

  // 코인 내부
  ctx.fillStyle = '#e0a800';
  ctx.beginPath(); ctx.arc(x, y, r * 0.7, 0, Math.PI*2); ctx.fill();

  // 코인 글자
  ctx.fillStyle = '#f0c040';
  ctx.font = `bold ${Math.round(r * 0.9)}px Arial`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('₩', x, y + 1);
}

function drawBomb(item, t) {
  const x = item.x, y = item.y;
  const wobble = Math.sin(t * 0.15 + x) * 3;

  // 그림자
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath(); ctx.ellipse(x, y + ITEM_R + 2, ITEM_R * 0.6, 4, 0, 0, Math.PI*2); ctx.fill();

  // 몸체
  const grad = ctx.createRadialGradient(x - 5, y - 5, 2, x, y, ITEM_R);
  grad.addColorStop(0, '#555');
  grad.addColorStop(1, '#111');
  ctx.fillStyle = grad;
  ctx.beginPath(); ctx.arc(x, y + wobble, ITEM_R, 0, Math.PI*2); ctx.fill();

  // 광택
  ctx.fillStyle = 'rgba(255,255,255,0.15)';
  ctx.beginPath(); ctx.ellipse(x - 5, y - 5 + wobble, 6, 4, -0.5, 0, Math.PI*2); ctx.fill();

  // 도화선
  ctx.strokeStyle = '#aa7700';
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(x, y - ITEM_R + wobble);
  ctx.quadraticCurveTo(x + 10, y - ITEM_R - 12 + wobble, x + 6, y - ITEM_R - 20 + wobble);
  ctx.stroke();

  // 불꽃
  const flicker = Math.sin(t * 0.4) > 0;
  ctx.fillStyle = flicker ? '#ff8800' : '#ffdd00';
  ctx.beginPath(); ctx.arc(x + 6, y - ITEM_R - 20 + wobble, 4, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#ffffff88';
  ctx.beginPath(); ctx.arc(x + 6, y - ITEM_R - 21 + wobble, 2, 0, Math.PI*2); ctx.fill();

  // 💣 이모지
  ctx.font = '11px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#fff';
  ctx.fillText('💣', x, y + wobble);
}

/* ════════════════════════════════
   PARTICLES
════════════════════════════════ */
let particles = [];

function spawnParticles(x, y, type) {
  const count = type === 'coin' ? 10 : 20;
  const colors = type === 'coin' ? ['#f0c040','#ffe080','#ffaa00'] : ['#ff4400','#ff8800','#ffdd00','#ff2200'];
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 2 + Math.random() * 4;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 2,
      color: colors[Math.floor(Math.random() * colors.length)],
      life: 1,
      decay: 0.025 + Math.random() * 0.03,
      r: 3 + Math.random() * 4,
      type
    });
  }
}

function updateParticles() {
  particles = particles.filter(p => p.life > 0);
  for (const p of particles) {
    p.x  += p.vx;
    p.y  += p.vy;
    p.vy += 0.15;  // gravity
    p.life -= p.decay;
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r * p.life, 0, Math.PI*2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}

/* ════════════════════════════════
   LANE TRANSITION
════════════════════════════════ */
let carX = laneX(1);
let targetX = laneX(1);

function moveLane(dir) {
  const newLane = Math.max(0, Math.min(LANE_COUNT - 1, lane + dir));
  if (newLane !== lane) {
    lane = newLane;
    targetX = laneX(lane);
  }
}

/* ════════════════════════════════
   COLLISION
════════════════════════════════ */
function checkCollision(item) {
  const dx = carX - item.x;
  const dy = carY - item.y;
  return Math.sqrt(dx * dx + dy * dy) < (ITEM_R + 18);
}

/* ════════════════════════════════
   SHOW RESULT OVERLAY
════════════════════════════════ */
function showResult(reason) {
  state = reason;
  if (score > bestScore) bestScore = score;
  bestEl.textContent = bestScore;

  const isBomb = reason === 'dead';
  overlay.innerHTML = `
    <h2>${isBomb ? '💥 폭탄 충돌!' : '⏱ 시간 종료!'}</h2>
    <div class="result-score">${score}</div>
    <div class="result-label">점</div>
    <p>
      ${isBomb ? '폭탄을 밟아 게임이 종료됐어요!' : '30초 동안 수고하셨어요!'}<br>
      🏆 최고 기록: <b>${bestScore}점</b>
    </p>
    <button id="startBtn">🔄 다시 하기!</button>
  `;
  overlay.style.display = 'flex';
  document.getElementById('startBtn').addEventListener('click', startGame);
}

/* ════════════════════════════════
   SCORE FLOAT TEXT
════════════════════════════════ */
let floats = [];
function spawnFloat(x, y, text, color) {
  floats.push({ x, y, text, color, life: 1, vy: -1.8 });
}
function drawFloats() {
  floats = floats.filter(f => f.life > 0);
  for (const f of floats) {
    ctx.globalAlpha = f.life;
    ctx.fillStyle = f.color;
    ctx.font = 'bold 20px Segoe UI';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(f.text, f.x, f.y);
    f.y  += f.vy;
    f.life -= 0.025;
    ctx.globalAlpha = 1;
  }
}

/* ════════════════════════════════
   MAIN LOOP
════════════════════════════════ */
let rafId = null;

function loop(now) {
  if (state !== 'playing') return;

  const dt = (now - lastTick) / 1000;
  lastTick = now;
  frame++;

  // 타이머
  timeLeft -= dt;
  if (timeLeft <= 0) { timeLeft = 0; updateHUD(); showResult('timeout'); return; }
  updateHUD();

  // 속도 증가 (점수에 따라)
  speed = 4 + Math.floor(score / 30) * 0.5;
  spawnInterval = Math.max(45, 90 - Math.floor(score / 20) * 5);

  // 도로 오프셋
  roadOffset += speed;

  // 차 위치 보간
  carX += (targetX - carX) * 0.15;

  // 아이템 스폰
  spawnTimer++;
  if (spawnTimer >= spawnInterval) { spawnItem(); spawnTimer = 0; }

  // 아이템 이동 + 충돌
  for (let i = items.length - 1; i >= 0; i--) {
    const it = items[i];
    it.y += speed;
    if (it.y > CANVAS_H + ITEM_R) { items.splice(i, 1); continue; }

    if (checkCollision(it)) {
      spawnParticles(it.x, it.y, it.type);
      items.splice(i, 1);
      if (it.type === 'coin') {
        score += COIN_SCORE;
        timeLeft = Math.min(MAX_TIME, timeLeft + COIN_TIME_BONUS);
        spawnFloat(carX, carY - 30, `+${COIN_SCORE} 🪙`, '#f0c040');
        spawnFloat(carX, carY - 55, `+${COIN_TIME_BONUS}초 ⏱`, '#4ecca3');
      } else {
        shakeFrames = 20;
        showResult('dead');
        return;
      }
    }
  }

  // 그리기
  ctx.save();
  if (shakeFrames > 0) {
    ctx.translate(Math.random() * 8 - 4, Math.random() * 8 - 4);
    shakeFrames--;
  }

  drawRoad();

  // 아이템
  for (const it of items) {
    if (it.type === 'coin') drawCoin(it, frame);
    else drawBomb(it, frame);
  }

  // 파티클
  updateParticles();

  // 플로팅 텍스트
  drawFloats();

  // 플레이어 차
  drawCar(carX, carY, true);

  // 속도 표시
  ctx.fillStyle = '#ffffff55';
  ctx.font = '12px Segoe UI';
  ctx.textAlign = 'right';
  ctx.textBaseline = 'bottom';
  ctx.fillText(`SPEED x${speed.toFixed(1)}`, CANVAS_W - 8, CANVAS_H - 8);

  ctx.restore();

  rafId = requestAnimationFrame(loop);
}

/* ════════════════════════════════
   START / STOP
════════════════════════════════ */
function startGame() {
  overlay.style.display = 'none';
  initGame();
  carX   = laneX(1);
  targetX= laneX(1);
  state  = 'playing';
  lastTick = performance.now();
  if (rafId) cancelAnimationFrame(rafId);
  rafId = requestAnimationFrame(loop);
}

/* ════════════════════════════════
   INPUT
════════════════════════════════ */
document.addEventListener('keydown', e => {
  if (state !== 'playing') return;
  if (e.key === 'ArrowLeft'  || e.key === 'a' || e.key === 'A') { e.preventDefault(); moveLane(-1); }
  if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') { e.preventDefault(); moveLane(1); }
});

// 터치 / 모바일
let touchStartX = null;
canvas.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, { passive: true });
canvas.addEventListener('touchend', e => {
  if (touchStartX === null || state !== 'playing') return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  if (Math.abs(dx) > 20) moveLane(dx > 0 ? 1 : -1);
  touchStartX = null;
}, { passive: true });

/* ════════════════════════════════
   INITIAL RENDER (idle)
════════════════════════════════ */
(function idleDraw() {
  drawRoad();
  drawCar(laneX(1), CANVAS_H - 120, true);
})();

/* 오버레이 위치 맞추기 */
overlay.style.width  = CANVAS_W + 'px';
overlay.style.height = CANVAS_H + 'px';
overlay.style.top    = '0px';
overlay.style.left   = '0px';

startBtn.addEventListener('click', startGame);
</script>
</body>
</html>
